<html lang="tr">
<head>
  <meta charset="UTF-8" />

  <title>FFmpeg WebAssembly Test</title>

  <!-- GitHub Pages için SharedArrayBuffer (COOP/COEP) desteği sağlar -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/coi-serviceworker/0.1.7/coi-serviceworker.min.js"></script>

  <!-- FFmpeg 0.12 UMD Kütüphaneleri -->
  <script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
  <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 24px;
      margin: 0;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #2563eb;
    }
    button:disabled {
      background: #475569;
      cursor: not-allowed;
    }
    #status {
      margin-top: 15px;
      font-size: 14px;
      color: #38bdf8;
    }
    #logs {
      margin-top: 15px;
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      font-family: monospace;
      font-size: 12px;
      max-height: 250px;
      overflow-y: auto;
      white-space: pre-wrap;
      color: #a5f3fc;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>FFmpeg.wasm Çalışma Testi</h2>
    <p>Worker ve WASM dosyaları Blob URL üzerinden GitHub Pages ile tam uyumlu yüklenir.</p>

    <button id="loadBtn" onclick="initFFmpeg()">FFmpeg Yükle</button>
    <div id="status">Durum: Bekleniyor...</div>
    <div id="logs">Loglar burada görünecek...</div>
  </div>

  <script>
    const statusEl = document.getElementById("status");
    const logsEl = document.getElementById("logs");
    const loadBtn = document.getElementById("loadBtn");

    function log(message) {
      logsEl.textContent += message + "\n";
      logsEl.scrollTop = logsEl.scrollHeight;
    }

    async function initFFmpeg() {
      loadBtn.disabled = true;
      statusEl.textContent = "FFmpeg dosyaları indiriliyor ve Blob'a dönüştürülüyor...";

      try {
        const { FFmpeg } = FFmpegWASM;
        const { toBlobURL } = FFmpegUtil;

        const ffmpeg = new FFmpeg();

        // FFmpeg loglarını yakala
        ffmpeg.on("log", ({ message }) => {
          log(`[FFmpeg] ${message}`);
        });

        // Yükleme ilerleme durumu
        ffmpeg.on("progress", ({ progress }) => {
          statusEl.textContent = `İlerleme: %${Math.round(progress * 100)}`;
        });

        // 0.12.10 UMD çekirdek adresleri
        const coreBaseURL = "https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd";
        const ffmpegBaseURL = "https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd";

        log("Worker ve WASM dosyaları dönüştürülüyor...");

        // Hatanın sebebi olan worker dosyasını ve çekirdek dosyalarını Blob URL yapıyoruz
        await ffmpeg.load({
          classWorkerURL: await toBlobURL(`${ffmpegBaseURL}/814.ffmpeg.js`, "text/javascript"),
          coreURL: await toBlobURL(`${coreBaseURL}/ffmpeg-core.js`, "text/javascript"),
          wasmURL: await toBlobURL(`${coreBaseURL}/ffmpeg-core.wasm`, "application/wasm")
        });

        statusEl.textContent = "Durum: FFmpeg başarıyla yüklendi ve hazır!";
        statusEl.style.color = "#4ade80";
        log("Tebrikler! Worker ve WASM hatasız yüklendi.");
        
        // Örnek: ffmpeg versiyonunu terminale yazdır
        await ffmpeg.exec(["-version"]);

      } catch (err) {
        console.error(err);
        statusEl.textContent = "Hata oluştu! Konsolu veya logları kontrol edin.";
        statusEl.style.color = "#f87171";
        log("HATA: " + err.message);
        loadBtn.disabled = false;
      }
    }
  </script>
</body>

        <div class="field">
          <label for="samplerate">Örnekleme Hızı (Sample Rate)</label>
          <select id="samplerate">
            <option value="same" selected>Orijinali Koru</option>
            <option value="44100">44.1 kHz (Standart)</option>
            <option value="32000">32.0 kHz (Tasarruf)</option>
            <option value="22050">22.0 kHz (Konuşma / Telsiz)</option>
          </select>
        </div>
      </div>

      <!-- Action Button -->
      <button class="btn-main" id="startBtn" disabled>
        <span>⚡ Sıkıştırmayı Başlat</span>
      </button>

      <!-- Progress Section -->
      <div class="progress-container" id="progressContainer">
        <div class="progress-info">
          <span id="statusLabel">İşlem bekleniyor...</span>
          <span id="percentLabel">0%</span>
        </div>
        <div class="progress-track">
          <div class="progress-bar" id="progressBar"></div>
        </div>
      </div>

      <!-- Results Section -->
      <div class="results-area" id="resultsArea">
        <div class="stats-card">
          <div class="stat-item">
            <div class="stat-label">Önceki Boyut</div>
            <div class="stat-value" id="oldSize">-</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">Yeni Boyut</div>
            <div class="stat-value" id="newSize">-</div>
          </div>
          <div class="stat-item">
            <div class="stat-label">Tasarruf</div>
            <div class="stat-value" id="saveRate">-%</div>
          </div>
        </div>

        <!-- Audio Players -->
        <div class="players-box">
          <div class="player-row">
            <span class="player-label">Orijinal Ses:</span>
            <audio id="origAudio" controls></audio>
          </div>
          <div class="player-row">
            <span class="player-label">Sıkıştırılmış Sonuç:</span>
            <audio id="compAudio" controls></audio>
          </div>
        </div>

        <a href="#" class="btn-download" id="downloadBtn" download="ses.mp3">
          📥 Sıkıştırılmış Dosyayı İndir
        </a>
      </div>
    </div>
  </div>

  <script>
    const { FFmpeg } = FFmpegWASM;
    const { fetchFile, toBlobURL } = FFmpegUtil;

    let ffmpeg = null;
    let currentFile = null;
    let fileDuration = 0;

    // Element Seçicileri
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileDetails = document.getElementById('fileDetails');
    const startBtn = document.getElementById('startBtn');
    const progressContainer = document.getElementById('progressContainer');
    const statusLabel = document.getElementById('statusLabel');
    const percentLabel = document.getElementById('percentLabel');
    const progressBar = document.getElementById('progressBar');
    const resultsArea = document.getElementById('resultsArea');
    const oldSizeEl = document.getElementById('oldSize');
    const newSizeEl = document.getElementById('newSize');
    const saveRateEl = document.getElementById('saveRate');
    const origAudio = document.getElementById('origAudio');
    const compAudio = document.getElementById('compAudio');
    const downloadBtn = document.getElementById('downloadBtn');

    // Ayarlar
    const qualitySelect = document.getElementById('quality');
    const formatSelect = document.getElementById('format');
    const channelSelect = document.getElementById('channels');
    const sampleRateSelect = document.getElementById('samplerate');

    // Drag-Drop Yönetimi
    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('drag-active');
    });

    ['dragleave', 'drop'].forEach(ev => {
      dropZone.addEventListener(ev, () => dropZone.classList.remove('drag-active'));
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });

    function handleFile(file) {
      if (!file) return;
      currentFile = file;

      // Dosya boyutu ve adını göster
      const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
      fileDetails.style.display = 'block';
      fileDetails.textContent = `Seçildi: ${file.name} (${sizeMB} MB)`;

      // Orijinal sesi oynatıcıya bağla ve süresini al
      const url = URL.createObjectURL(file);
      origAudio.src = url;
      origAudio.onloadedmetadata = () => {
        fileDuration = origAudio.duration;
      };

      startBtn.disabled = false;
      resultsArea.style.display = 'none';
      progressContainer.style.display = 'none';
    }

    // FFmpeg Çekirdeğini Başlat
    async function initFFmpegEngine() {
      if (ffmpeg) return;
      ffmpeg = new FFmpeg();

      statusLabel.textContent = 'Motor çekirdeği yükleniyor...';
      updateProgress(10);

      const baseURL = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/umd';

      // FFmpeg loglarından progress çıkarma
      ffmpeg.on('log', ({ message }) => {
        const timeMatch = message.match(/time=(\d{2}):(\d{2}):(\d{2}\.\d{2})/);
        if (timeMatch && fileDuration > 0) {
          const hours = parseFloat(timeMatch[1]);
          const minutes = parseFloat(timeMatch[2]);
          const seconds = parseFloat(timeMatch[3]);
          const currentTime = hours * 3600 + minutes * 60 + seconds;
          const pct = Math.min(Math.round((currentTime / fileDuration) * 90) + 10, 95);
          updateProgress(pct);
        }
      });

      await ffmpeg.load({
        coreURL: await toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript'),
        wasmURL: await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm')
      });
    }

    function updateProgress(pct) {
      progressBar.style.width = `${pct}%`;
      percentLabel.textContent = `${pct}%`;
    }

    // Dönüştürmeyi Başlat
    startBtn.addEventListener('click', async () => {
      if (!currentFile) return;

      try {
        startBtn.disabled = true;
        progressContainer.style.display = 'block';
        resultsArea.style.display = 'none';
        updateProgress(5);

        await initFFmpegEngine();

        statusLabel.textContent = 'Dosya sanal diske yazılıyor...';
        const inExt = currentFile.name.split('.').pop().toLowerCase() || 'mp3';
        const inName = `input.${inExt}`;
        const outFormat = formatSelect.value;
        const outName = `output.${outFormat}`;

        await ffmpeg.writeFile(inName, await fetchFile(currentFile));

        // Parametreleri hazırla
        const args = ['-i', inName];

        // Bitrate
        args.push('-b:a', qualitySelect.value);

        // Kanallar (Mono / Stereo)
        if (channelSelect.value !== 'same') {
          args.push('-ac', channelSelect.value);
        }

        // Örnekleme hızı
        if (sampleRateSelect.value !== 'same') {
          args.push('-ar', sampleRateSelect.value);
        }

        args.push(outName);

        statusLabel.textContent = 'Sıkıştırma ve kodlama yapılıyor...';
        await ffmpeg.exec(args);

        statusLabel.textContent = 'Sonuç oluşturuluyor...';
        const outData = await ffmpeg.readFile(outName);

        // Blob & URL oluştur
        const mimeTypes = {
          mp3: 'audio/mp3',
          m4a: 'audio/mp4',
          ogg: 'audio/ogg'
        };
        const blob = new Blob([outData.buffer], { type: mimeTypes[outFormat] || 'audio/mp3' });
        const outUrl = URL.createObjectURL(blob);

        // İstatistikleri Hesapla
        const origMB = (currentFile.size / (1024 * 1024)).toFixed(2);
        const compMB = (blob.size / (1024 * 1024)).toFixed(2);
        const savePct = Math.round((1 - (blob.size / currentFile.size)) * 100);

        oldSizeEl.textContent = `${origMB} MB`;
        newSizeEl.textContent = `${compMB} MB`;
        saveRateEl.textContent = `${savePct > 0 ? '%' + savePct : '%0'}`;

        compAudio.src = outUrl;
        downloadBtn.href = outUrl;
        
        const cleanBase = currentFile.name.substring(0, currentFile.name.lastIndexOf('.')) || currentFile.name;
        downloadBtn.download = `${cleanBase}_compressed.${outFormat}`;

        updateProgress(100);
        statusLabel.textContent = 'İşlem Başarıyla Tamamlandı!';
        resultsArea.style.display = 'block';

      } catch (err) {
        console.error(err);
        statusLabel.textContent = 'Hata oluştu: ' + (err.message || err);
      } finally {
        startBtn.disabled = false;
      }
    });
  </script>
